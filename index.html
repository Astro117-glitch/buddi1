      async loadData() {
        try {
          const res = await fetch('/api/data');

            allData = await res.json();
            this.subscribers.forEach(cb => cb(allData));
          }
        } catch (e) {
          console.error('Database connection error:', e);
        }
      },
      subscribe(cb) {
        this.subscribers.push(cb);
        this.loadData();
        setInterval(() => this.loadData(), 3000);

      async create(payload) {

           <input id="settings-app-bg" type="color" value="#0f0a1e" class="w-10 h-10 rounded-lg cursor-pointer bg-gray-800 border-0 p-0">
         </div>
         <div class="flex justify-between items-center">
           <label class="text-sm font-medium text-gray-300">Accent Color</label> 
           <input id="settings-chat-color" type="color" value="#8b5cf6" class="w-10 h-10 rounded-lg cursor-pointer bg-gray-800 border-0 p-0">
         </div>
         <div class="flex justify-between items-center">
           <label class="text-sm font-medium text-gray-300">Bubble Style</label> 
           <select id="settings-bubble-style" class="bg-gray-800 border border-gray-700 rounded-lg text-sm px-3 py-1.5 text-white outline-none focus:border-purple-500">
             <option value="modern">Modern (Rounded)</option>
             <option value="sharp">Classic (Sharp)</option>
           </select>
         </div>
       </div>
     </div>
    </div>
    
    <button id="apply-settings" type="button" class="canva-button w-full mt-8 py-3.5 rounded-xl font-bold shadow-lg">Save Preferences</button> 
   </div>
  </div>

  <div id="edit-profile-modal" class="fixed inset-0 bg-black/60 modal-overlay flex items-center justify-center p-4 hidden z-50">
   <div class="bg-gray-900 border border-gray-700 rounded-3xl p-8 w-full max-w-sm shadow-2xl">
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-2xl font-bold text-white">Edit Profile</h3>
      <button id="cancel-edit-profile" class="text-gray-500 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
    </div>
    
    <div class="flex flex-col items-center mb-6">
      <div class="relative group cursor-pointer">
        <div id="edit-avatar-preview" class="w-24 h-24 rounded-full bg-gray-800 border-2 border-gray-700 overflow-hidden flex items-center justify-center">
          <i data-lucide="user" class="w-10 h-10 text-gray-500"></i>
        </div>
        <div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <i data-lucide="camera" class="w-8 h-8 text-white"></i>
        </div>
        <input id="edit-avatar-upload" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
      </div>
      <p class="text-xs text-gray-500 mt-2">Tap to change picture</p>
    </div>

    <div class="space-y-4">
     <div>
      <label class="text-gray-300 font-medium text-sm block mb-1.5">Bio</label>
      <input id="edit-bio" type="text" maxlength="80" class="w-full bg-black/40 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors">
     </div>
     <div>
      <label class="text-gray-300 font-medium text-sm block mb-1.5">Status</label> 
      <select id="edit-status" class="w-full bg-black/40 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500 transition-colors"> 
        <option value="online">🟢 Online</option> 
        <option value="idle">🌙 Idle</option> 
        <option value="dnd">🔴 Do Not Disturb</option> 
        <option value="invisible">⚫ Invisible</option> 
      </select>
     </div>
    </div>
    <button id="save-edit-profile" type="button" class="canva-button w-full mt-8 py-3.5 rounded-xl font-bold shadow-lg">Update Profile</button> 
   </div>
  </div>

  <script>
    let allData = [];
    let profile = null;
    let activeChannel = 'general';
    let attachedFile = null;
    let customAvatarBase64 = null;
    
    const ADMINS = [...Array.from({length:20}, (_,i) => `admin_${i+1}`), 'maintester', 'ryn_only', 'rini'];
    const MAX_GALLERY_ITEMS = 100;
    const PRUNE_COUNT = 50;
    let bubbleStyle = 'modern';

    function isAdmin(u) { return ADMINS.includes((u||'').toLowerCase()); }
    function isBanned(u) {
      if (!u) return false;
      const bans = allData.filter(d => d.type === 'ban' && (d.username||'').toLowerCase() === u.toLowerCase());
      if (!bans.length) return false;
      const latest = bans.sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''))[0];
      return latest.banned === 'true';
    }
    
    function escHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]);
    }

    function showToast(msg, type = 'default') {
      const existing = document.querySelectorAll('.toast');
      existing.forEach(el => el.remove());
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-red-600' : (type === 'success' ? 'bg-green-600' : 'bg-purple-600');
      toast.className = `toast fixed top-6 right-6 ${bg} text-white px-5 py-3.5 rounded-xl shadow-2xl z-[1000] text-sm font-bold flex items-center gap-3`;
      toast.innerHTML = `<i data-lucide="${type==='error'?'alert-circle':'check-circle'}" class="w-5 h-5"></i> <span>${escHtml(msg)}</span>`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s ease'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    function processMediaFile(file, isAvatar, callback) {
      if (!file) return;
      const isVideo = file.type.startsWith('video/');
      const maxSize = isVideo ? 5000000 : 2000000;
      
      if (file.size > maxSize) {
        showToast(`File too large. Max ${isVideo?'5MB':'2MB'}`, 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        if (isVideo) {
          callback(e.target.result, file.name, 'video');
        } else {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = isAvatar ? 200 : 800;
            const MAX_HEIGHT = isAvatar ? 200 : 800;
            let width = img.width; let height = img.height;
            if (width > height && width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            else if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
            
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            callback(canvas.toDataURL('image/jpeg', isAvatar ? 0.9 : 0.7), file.name, 'image');
          }
          img.src = e.target.result;
        }
      }
      reader.readAsDataURL(file);
    }

    lucide.createIcons();

    // Auth Switcher Tabs
    document.getElementById('tab-login').addEventListener('click', () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-white bg-purple-600/50 shadow transition-all';
      document.getElementById('tab-register').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-all';
      document.getElementById('auth-title').textContent = 'Welcome Back';
    });

    document.getElementById('tab-register').addEventListener('click', () => {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('tab-register').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-white bg-purple-600/50 shadow transition-all';
      document.getElementById('tab-login').className = 'flex-1 py-2 rounded-lg text-sm font-bold text-gray-400 hover:text-white transition-all';
      document.getElementById('auth-title').textContent = 'Join Buddi';
    });

    // Register Avatar Upload
    document.getElementById('auth-avatar-upload').addEventListener('change', e => {
      processMediaFile(e.target.files[0], true, (base64) => {
        customAvatarBase64 = base64;
        document.getElementById('auth-avatar-img').src = base64;
        document.getElementById('auth-avatar-preview').classList.remove('hidden');
      });
    });
    document.getElementById('auth-avatar-clear').addEventListener('click', () => {
      customAvatarBase64 = null;
      document.getElementById('auth-avatar-upload').value = '';
      document.getElementById('auth-avatar-preview').classList.add('hidden');
    });

    // Register Handler
    document.getElementById('register-form').addEventListener('submit', async e => {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;
      
      if (!username || username.length < 3) { showToast('Username must be 3+ chars', 'error'); return; }
      
      // Check uniqueness
      const existing = allData.find(d => d.type === 'profile' && (d.username.toLowerCase() === username.toLowerCase() || d.email === email));
      if (existing) {
        showToast('Username or Email already taken', 'error');
        return;
      }

      try {
        const payload = { 
          type:'profile', username, email, password, bio:'', 
          avatar: customAvatarBase64 || 'default', 
          group_name:'', message:'', channel:'', file_name:'', file_data:'', 
          timestamp:new Date().toISOString(), banned:'', banned_by:'', members:'', 
          settings_theme:'', profile_bg:'', chat_color:'', app_bg:'', status:'online' 
        };
        
        if (window.dataSdk && window.dataSdk.create) {
          const res = await window.dataSdk.create(payload);
          if (!res.isOk) throw new Error('DB Error');
        } else {
          payload.id = Date.now().toString();
          allData.push(payload);
        }
        
        localStorage.setItem('buddi_active_user', username);
        profile = payload;
        showToast('Account created successfully!', 'success');
        evaluateSystemState();
      } catch (err) {
        showToast('Registration failed', 'error');
      }
    });

    // Login Handler
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const identifier = document.getElementById('login-identifier').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      const user = allData.find(d => d.type === 'profile' && (d.username.toLowerCase() === identifier || d.email === identifier));
      if (!user || user.password !== password) {
        showToast('Invalid username/email or password', 'error');
        return;
      }

      localStorage.setItem('buddi_active_user', user.username);
      profile = user;
      showToast('Welcome back, ' + user.username, 'success');
      evaluateSystemState();
    });

    // Main App Navigation
    document.querySelectorAll('.app-nav-btn[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.app-nav-btn[data-view]').forEach(b => {
          b.classList.remove('app-nav-active', 'text-white');
          b.classList.add('text-gray-400');
        });
        btn.classList.add('app-nav-active', 'text-white');
        btn.classList.remove('text-gray-400');
        
        const view = btn.dataset.view;
        document.getElementById('view-chat').classList.toggle('hidden', view !== 'chat');
        document.getElementById('view-moments').classList.toggle('hidden', view !== 'moments');
        document.getElementById('view-gallery').classList.toggle('hidden', view !== 'gallery');
        document.getElementById('context-sidebar').classList.toggle('hidden', view !== 'chat');
        
        if (view === 'moments') renderMoments();
        if (view === 'gallery') renderGallery();
      });
    });

    // Profile Editing
    document.getElementById('open-edit-profile').addEventListener('click', () => {
      if (!profile) return;
      document.getElementById('edit-bio').value = profile.bio || '';
      document.getElementById('edit-status').value = profile.status || 'online';
      
      const preview = document.getElementById('edit-avatar-preview');
      if (profile.avatar && profile.avatar.startsWith('data:image')) {
        preview.innerHTML = `<img src="${profile.avatar}" class="w-full h-full object-cover">`;
        customAvatarBase64 = profile.avatar;
      } else {
        preview.innerHTML = `<i data-lucide="user" class="w-10 h-10 text-gray-500"></i>`;
        lucide.createIcons();
        customAvatarBase64 = null;
      }
      document.getElementById('edit-profile-modal').classList.remove('hidden');
    });

    document.getElementById('cancel-edit-profile').addEventListener('click', () => {
      document.getElementById('edit-profile-modal').classList.add('hidden');
    });

    document.getElementById('edit-avatar-upload').addEventListener('change', e => {
      processMediaFile(e.target.files[0], true, (base64) => {
        customAvatarBase64 = base64;
        document.getElementById('edit-avatar-preview').innerHTML = `<img src="${base64}" class="w-full h-full object-cover">`;
      });
    });

    document.getElementById('save-edit-profile').addEventListener('click', async () => {
      const bio = document.getElementById('edit-bio').value.trim();
      const status = document.getElementById('edit-status').value;
      const avatar = customAvatarBase64 || profile.avatar;
      
      try {
        const profileDoc = allData.find(d => d.type === 'profile' && d.username === profile.username);
        if (profileDoc && window.dataSdk && window.dataSdk.update) {
           await window.dataSdk.update({ ...profileDoc, bio, status, avatar });
        }
        profile.bio = bio; profile.status = status; profile.avatar = avatar;
        
        document.getElementById('edit-profile-modal').classList.add('hidden');
        updateNavAvatar();
        renderMessages();
        showToast('Profile updated', 'success');
      } catch (err) {
        showToast('Update failed', 'error');
      }
    });

    function updateNavAvatar() {
      if (!profile) return;
      const container = document.getElementById('nav-profile-avatar');
      if (profile.avatar && profile.avatar.startsWith('data:image')) {
        container.innerHTML = `<img src="${profile.avatar}" class="w-full h-full object-cover">`;
      }
    }

    document.getElementById('open-settings').addEventListener('click', () => document.getElementById('settings-modal').classList.remove('hidden'));
    document.getElementById('close-settings').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));
    
    document.getElementById('apply-settings').addEventListener('click', async () => {
      const appBg = document.getElementById('settings-app-bg').value;
      const chatColor = document.getElementById('settings-chat-color').value;
      bubbleStyle = document.getElementById('settings-bubble-style').value;
      
      document.body.style.setProperty('--app-bg', appBg);
      document.documentElement.style.setProperty('--chat-accent', chatColor);
      
      document.getElementById('settings-modal').classList.add('hidden');
      renderMessages();
      showToast('Preferences applied', 'success');
    });

    async function enforceGalleryLimits() {
      const mediaMsgs = allData.filter(d => (d.type === 'message' || d.type === 'moment') && d.file_data)
                               .sort((a,b) => a.timestamp.localeCompare(b.timestamp));
      
      if (mediaMsgs.length > MAX_GALLERY_ITEMS) {
        const toDelete = mediaMsgs.slice(0, PRUNE_COUNT);
        for (const m of toDelete) {
          if (window.dataSdk && window.dataSdk.delete) await window.dataSdk.delete(m);
        }
        showToast(`Auto-pruned ${PRUNE_COUNT} old media items to save space.`);
      }
    }

    function openMediaViewer(url, type, caption) {
      const viewer = document.getElementById('media-viewer');
      const content = document.getElementById('viewer-content');
      const capEl = document.getElementById('viewer-caption');
      
      content.innerHTML = '';
      if (type === 'video') {
        content.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-full rounded-lg shadow-2xl"></video>`;
      } else {
        content.innerHTML = `<img src="${url}" class="max-w-full max-h-full rounded-lg shadow-2xl object-contain">`;
      }
      
      if (caption) {
        capEl.textContent = caption;
        capEl.classList.remove('hidden');
      } else {
        capEl.classList.add('hidden');
      }
      viewer.classList.remove('hidden');
    }
    
    document.getElementById('close-viewer').addEventListener('click', () => {
      document.getElementById('media-viewer').classList.add('hidden');
      document.getElementById('viewer-content').innerHTML = '';
    });

    document.getElementById('file-input').addEventListener('change', e => {
      processMediaFile(e.target.files[0], false, (base64, name, type) => {
        attachedFile = { name, data: base64, type };
        document.getElementById('attach-name').textContent = name;
        document.getElementById('attach-icon').setAttribute('data-lucide', type === 'video' ? 'video' : 'image');
        lucide.createIcons();
        document.getElementById('attach-preview').classList.remove('hidden');
      });
    });
    
    document.getElementById('attach-remove').addEventListener('click', () => {
      attachedFile = null;
      document.getElementById('attach-preview').classList.add('hidden');
      document.getElementById('file-input').value = '';
    });

    document.getElementById('msg-form').addEventListener('submit', async e => {
      e.preventDefault();
      if (!profile || isBanned(profile.username)) return;
      
      const input = document.getElementById('msg-input');
      const msg = input.value.trim();
      if (!msg && !attachedFile) return;
      
      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;
      input.value = '';
      
      try {
        const payload = { 
          type:'message', username:profile.username, channel:activeChannel, message:msg, 
          file_name: attachedFile ? attachedFile.name : '', 
          file_data: attachedFile ? attachedFile.data : '', 
          timestamp:new Date().toISOString(), avatar: profile.avatar 
        };

        if (window.dataSdk && window.dataSdk.create) {
          await window.dataSdk.create(payload);
          if (attachedFile) await enforceGalleryLimits();
        } else {
          payload.id = Date.now().toString();
          allData.push(payload);
          renderMessages(); 
        }

        attachedFile = null; 
        document.getElementById('attach-preview').classList.add('hidden'); 
        document.getElementById('file-input').value = '';
      } catch (err) {
        showToast('Transmit error', 'error'); input.value = msg;
      } finally {
        sendBtn.disabled = false; input.focus();
      }
    });

    document.getElementById('post-moment-btn').addEventListener('click', () => {
      document.getElementById('moment-file-input').click();
    });

    document.getElementById('moment-file-input').addEventListener('change', e => {
      const file = e.target.files[0];
      if(!file) return;
      processMediaFile(file, false, async (base64, name, type) => {
        const caption = prompt("Add a caption for this moment (optional):");
        if (caption === null) return;
        
        try {
          const payload = { 
            type:'moment', username:profile.username, message:caption.trim(), 
            file_name: name, file_data: base64, 
            timestamp:new Date().toISOString(), avatar: profile.avatar 
          };
          if (window.dataSdk && window.dataSdk.create) {
            await window.dataSdk.create(payload);
            await enforceGalleryLimits();
          } else {
            payload.id = Date.now().toString();
            allData.push(payload);
            renderMoments();
          }
          showToast('Moment posted!', 'success');
        } catch(e) {
          showToast('Failed to post moment', 'error');
        }
        document.getElementById('moment-file-input').value = '';
      });
    });

    function getAvatarHTML(username, pfpBase64) {
      const p = allData.find(d => d.type === 'profile' && d.username === username);
      const avatarData = pfpBase64 || (p && p.avatar) || 'default';
      const status = p && p.status ? p.status : 'online';
      const sColor = { online: '#22c55e', idle: '#facc15', dnd: '#ef4444', invisible: '#6b7280' }[status] || '#22c55e';
      
      let innerHtml = '';
      if (avatarData.startsWith('data:image')) {
        innerHtml = `<img src="${avatarData}" class="avatar-img">`;
      } else {
        innerHtml = `<div class="w-full h-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center"><span class="text-white font-bold">${username.charAt(0).toUpperCase()}</span></div>`;
      }
      
      return `
        <div class="relative w-10 h-10 shrink-0">
          <div class="avatar-wrapper w-full h-full rounded-full border-2 border-gray-800 shadow-md">${innerHtml}</div>
          <div class="status-dot" style="background-color: ${sColor};"></div>
        </div>
      `;
    }

    function renderMessages() {
      const container = document.getElementById('messages-container');
      const messages = allData.filter(d => d.type === 'message' && d.channel === activeChannel)
                              .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full opacity-60">
            <i data-lucide="message-square-dashed" class="w-16 h-16 text-gray-600 mb-4"></i>
            <p class="text-gray-400 font-medium">This channel is silent. Start the wave.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      let html = '';
      let lastSender = null;
      let lastDate = null;
      
      const bStyle = bubbleStyle === 'sharp' ? 'bubble-sharp' : 'bubble-modern';

      messages.forEach(m => {
        const isMine = profile && m.username === profile.username;
        const dObj = new Date(m.timestamp);
        const time = dObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = dObj.toLocaleDateString();
        const text = escHtml(m.message);
        
        if (dateStr !== lastDate) {
          html += `<div class="flex justify-center my-6"><span class="bg-gray-800/80 text-gray-400 text-[11px] font-bold uppercase tracking-widest px-4 py-1.5 rounded-full border border-gray-700">${dateStr}</span></div>`;
          lastDate = dateStr;
        }

        const showHeader = lastSender !== m.username || dateStr !== lastDate;
        lastSender = m.username;

        let attachHtml = '';
        if (m.file_data) {
          const isVideo = m.file_data.startsWith('data:video');
          const escapeData = m.file_data.replace(/'/g, "\\'");
          const escapeCaption = text.replace(/'/g, "\\'");
          if (isVideo) {
            attachHtml = `<div class="mt-2 relative group cursor-pointer overflow-hidden rounded-xl border border-gray-700 max-w-[280px]" onclick="openMediaViewer('${escapeData}', 'video', '${escapeCaption}')">
                            <video src="${m.file_data}" class="w-full object-cover" preload="metadata"></video>
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center group-hover:bg-black/20 transition-colors"><i data-lucide="play-circle" class="w-12 h-12 text-white opacity-80"></i></div>
                          </div>`;
          } else {
            attachHtml = `<img src="${m.file_data}" class="mt-2 max-w-[280px] rounded-xl border border-gray-700 shadow-md cursor-pointer hover:opacity-90 transition-opacity object-cover" onclick="openMediaViewer('${escapeData}', 'image', '${escapeCaption}')" loading="lazy">`;
          }
        }

        const alignClass = isMine ? 'flex-row-reverse' : '';
        const alignContent = isMine ? 'items-end' : 'items-start';
        
        let bubbleCss = isMine 
          ? `bg-[var(--chat-accent,#8b5cf6)] text-white shadow-md ${bubbleStyle==='modern'?'rounded-tl-2xl rounded-tr-sm rounded-b-2xl':'rounded-md'}` 
          : `bg-gray-800/80 text-gray-100 border border-gray-700/50 shadow-sm ${bubbleStyle==='modern'?'rounded-tr-2xl rounded-tl-sm rounded-b-2xl':'rounded-md'}`;

        html += `
          <div class="flex gap-3 fade-in ${alignClass} mb-1 group w-full">
            ${showHeader ? getAvatarHTML(m.username, m.avatar) : '<div class="w-10 h-10 shrink-0"></div>'}
            
            <div class="flex flex-col ${alignContent} max-w-[80%]">
              ${showHeader ? `
              <div class="flex items-center gap-2 mb-1 px-1">
                <span class="text-sm font-bold ${isMine?'text-purple-300':'text-gray-200'} tracking-wide">${escHtml(m.username)}</span>
                ${isAdmin(m.username) ? `<span class="admin-badge"><i data-lucide="shield" class="inline w-3 h-3 mr-0.5 mb-0.5"></i>Admin</span>` : ''}
                <span class="text-[10px] text-gray-500 font-medium">${time}</span>
              </div>
              ` : ''}
              
              <div class="${bStyle} ${bubbleCss} inline-block">
                ${text ? `<p class="text-[15px] leading-relaxed break-words whitespace-pre-wrap">${text}</p>` : ''}
                ${attachHtml}
              </div>
            </div>
          </div>
        `;
      });

      const isScrolledToBottom = container.scrollHeight - container.clientHeight <= container.scrollTop + 80;
      container.innerHTML = html;
      lucide.createIcons();
      if (isScrolledToBottom || messages.length <= 15) container.scrollTop = container.scrollHeight;
    }

    function renderMoments() {
      const container = document.getElementById('moments-feed');
      const moments = allData.filter(d => d.type === 'moment').sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      if(moments.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 mt-20"><i data-lucide="ghost" class="w-16 h-16 mx-auto mb-4 opacity-50"></i><p>No moments to show. Be the first.</p></div>`;
        lucide.createIcons(); return;
      }

      let html = '';
      moments.forEach(m => {
        const time = new Date(m.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
        const isVideo = m.file_data && m.file_data.startsWith('data:video');
        const escapeData = m.file_data ? m.file_data.replace(/'/g, "\\'") : '';
        const escapeCaption = m.message ? m.message.replace(/'/g, "\\'") : '';
        
        let mediaHtml = '';
        if (isVideo) {
          mediaHtml = `<div class="relative cursor-pointer bg-black flex items-center justify-center aspect-[4/5] overflow-hidden" onclick="openMediaViewer('${escapeData}', 'video', '${escapeCaption}')">
                        <video src="${m.file_data}" class="w-full h-full object-contain" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>
                        <div class="absolute inset-0 bg-black/20 flex items-center justify-center pointer-events-none"><i data-lucide="play" class="w-16 h-16 text-white opacity-80"></i></div>
                      </div>`;
        } else if (m.file_data) {
           mediaHtml = `<div class="cursor-pointer bg-black aspect-[4/5] overflow-hidden flex items-center justify-center" onclick="openMediaViewer('${escapeData}', 'image', '${escapeCaption}')">
                          <img src="${m.file_data}" class="w-full h-full object-contain hover:scale-105 transition-transform duration-500">
                        </div>`;
        }

        html += `
          <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-xl fade-in">
            <div class="p-4 flex items-center gap-3 border-b border-gray-800/50">
              ${getAvatarHTML(m.username, m.avatar)}
              <div>
                <h4 class="font-bold text-white text-sm">${escHtml(m.username)}</h4>
                <p class="text-[11px] text-gray-400">${time}</p>
              </div>
            </div>
            ${mediaHtml}
            ${m.message ? `<div class="p-4 bg-gray-900 text-gray-200 text-sm"><span class="font-bold mr-2">${escHtml(m.username)}</span>${escHtml(m.message)}</div>` : ''}
          </div>
        `;
      });
      container.innerHTML = html;
      lucide.createIcons();
    }

    function renderGallery() {
      const container = document.getElementById('gallery-grid');
      const countEl = document.getElementById('gallery-count');
      const media = allData.filter(d => (d.type === 'message' || d.type === 'moment') && d.file_data)
                           .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
      
      countEl.textContent = media.length;
      countEl.className = media.length > 80 ? 'text-red-400 font-bold' : 'text-gray-300';
      
      if(media.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center text-gray-500 mt-20"><i data-lucide="image-off" class="w-16 h-16 mx-auto mb-4 opacity-50"></i><p>The vault is empty.</p></div>`;
        lucide.createIcons(); return;
      }

      let html = '';
      media.forEach(m => {
        const isVideo = m.file_data.startsWith('data:video');
        const escapeData = m.file_data.replace(/'/g, "\\'");
        
        html += `
          <div class="media-card aspect-square relative cursor-pointer group bg-black flex items-center justify-center" onclick="openMediaViewer('${escapeData}', '${isVideo?'video':'image'}', '')">
            ${isVideo 
              ? `<video src="${m.file_data}" class="w-full h-full object-cover"></video>
                 <div class="absolute top-2 right-2 bg-black/60 rounded p-1"><i data-lucide="video" class="w-4 h-4 text-white"></i></div>` 
              : `<img src="${m.file_data}" class="w-full h-full object-cover" loading="lazy">`
            }
            <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center flex-col p-2 text-center">
              <span class="text-white font-bold text-sm truncate w-full">${escHtml(m.username)}</span>
              <span class="text-gray-300 text-[10px]">${new Date(m.timestamp).toLocaleDateString()}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
      lucide.createIcons();
    }

    function renderChannels() {
      const list = document.getElementById('channel-list');
      const groups = allData.filter(d => d.type === 'group');
      const existing = list.querySelectorAll('[data-channel]:not([data-channel="general"])');
      const groupNames = new Set(groups.map(g => g.group_name));
      
      existing.forEach(el => { if (!groupNames.has(el.dataset.channel)) el.remove(); });
      
      groups.forEach(g => {
        const membersList = (g.members || '').split(',').map(s=>s.trim().toLowerCase());
        const canAccess = isAdmin(profile.username) || membersList.includes(profile.username.toLowerCase());
        
        if (!canAccess || list.querySelector(`[data-channel="${CSS.escape(g.group_name)}"]`)) return;
        
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'channel-btn w-full text-left px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 flex items-center gap-3 text-sm font-medium transition-all mt-1';
        btn.dataset.channel = g.group_name;
        btn.innerHTML = `<i data-lucide="lock" class="w-4 h-4"></i><span class="truncate">${escHtml(g.group_name)}</span>`;
        btn.addEventListener('click', () => {
          activeChannel = g.group_name;
          document.getElementById('current-channel-name').textContent = g.group_name;
          document.querySelectorAll('.channel-btn').forEach(b => b.classList.toggle('channel-active', b.dataset.channel === g.group_name));
          document.getElementById('add-member-btn').classList.remove('hidden');
          renderMessages();
        });
        list.appendChild(btn);
      });
      
      list.querySelector('[data-channel="general"]').onclick = () => {
         activeChannel = 'general';
         document.getElementById('current-channel-name').textContent = 'general';
         document.querySelectorAll('.channel-btn').forEach(b => b.classList.toggle('channel-active', b.dataset.channel === 'general'));
         document.getElementById('add-member-btn').classList.add('hidden');
         renderMessages();
      }
      lucide.createIcons();
    }

    function evaluateSystemState() {
      if (profile) {
        if (isBanned(profile.username)) {
          document.getElementById('banned-view').classList.remove('hidden');
          document.getElementById('auth-view').classList.add('hidden');
          document.getElementById('app-view').classList.add('hidden');
          document.getElementById('global-sidebar').classList.add('hidden');
        } else {
          document.getElementById('banned-view').classList.add('hidden');
          document.getElementById('auth-view').classList.add('hidden');
          document.getElementById('app-view').classList.remove('hidden');
          document.getElementById('global-sidebar').classList.remove('hidden');
          
          updateNavAvatar();
          renderChannels();
          
          const activeView = document.querySelector('.app-nav-active').dataset.view;
          if (activeView === 'chat') renderMessages();
          else if (activeView === 'moments') renderMoments();
          else if (activeView === 'gallery') renderGallery();
        }
      } else {
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('app-view').classList.add('hidden');
        document.getElementById('global-sidebar').classList.add('hidden');
        document.getElementById('banned-view').classList.add('hidden');
      }
    }

    // Group & Member Modal Handlers
    document.getElementById('open-group-modal')?.addEventListener('click', () => {
      document.getElementById('group-modal').classList.remove('hidden');
    });
    document.getElementById('cancel-group')?.addEventListener('click', () => {
      document.getElementById('group-modal').classList.add('hidden');
    });
    document.getElementById('create-group')?.addEventListener('click', async () => {
      const input = document.getElementById('group-name-input');
      const name = input.value.trim().toLowerCase();
      if (!name) return;
      try {
        const payload = { type: 'group', group_name: name, members: profile ? profile.username : '' };
        await window.dataSdk.create(payload);
        document.getElementById('group-modal').classList.add('hidden');
        input.value = '';
        showToast(`Group #${name} created`, 'success');
      } catch (err) {
        showToast('Failed to create group', 'error');
      }
    });

    document.getElementById('add-member-btn')?.addEventListener('click', () => {
      document.getElementById('member-modal').classList.remove('hidden');
    });
    document.getElementById('cancel-member')?.addEventListener('click', () => {
      document.getElementById('member-modal').classList.add('hidden');
    });
    document.getElementById('confirm-member')?.addEventListener('click', async () => {
      const input = document.getElementById('member-name-input');
      const targetUser = input.value.trim();
      if (!targetUser) return;
      const groupDoc = allData.find(d => d.type === 'group' && d.group_name === activeChannel);
      if (groupDoc) {
        const membersList = (groupDoc.members || '').split(',').map(m => m.trim()).filter(Boolean);
        if (!membersList.includes(targetUser)) {
          membersList.push(targetUser);
          const updatedMembers = membersList.join(',');
          await window.dataSdk.update({ type: 'group', group_name: activeChannel, members: updatedMembers });
          showToast(`Added ${targetUser} to ${activeChannel}`, 'success');
        } else {
          showToast(`${targetUser} is already in channel`, 'error');
        }
      }
      document.getElementById('member-modal').classList.add('hidden');
      input.value = '';
    });

    function init() {
      const storedUser = localStorage.getItem('buddi_active_user');
      if (window.dataSdk && window.dataSdk.subscribe) {
        window.dataSdk.subscribe(data => {
          allData = data || [];
          if (storedUser) {
            const found = allData.find(d => d.type === 'profile' && d.username === storedUser);
            if (found) profile = found;
          }
          evaluateSystemState();
        });
      } else {
        if (storedUser) profile = { username: storedUser, avatar: 'default', status: 'online' };
        allData = [{ type:'message', channel:'general', username:'System', message:'Network online.', timestamp:new Date().toISOString() }];
        evaluateSystemState();
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
 </body>
</html>
